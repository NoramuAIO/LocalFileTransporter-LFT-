<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LocalFileTransporter</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.0/font/bootstrap-icons.css">
    <link rel="stylesheet" href="/templates/style.css" media="all">
    <style>
        body { background-color: #1a1a1a; }
    </style>
</head>
<body>
    <div class="container">
        <header>
            <h1><i class="bi bi-folder2"></i> LocalFileTransporter - <span id="deviceTitle">Yükleniyor...</span></h1>
            <div class="info">
                <div class="info-item">
                    <div class="info-label"><i class="bi bi-globe"></i> IP Adresi</div>
                    <div class="info-value" id="ip">Yükleniyor...</div>
                </div>
                <div class="info-item">
                    <div class="info-label"><i class="bi bi-pc-display"></i> Cihaz Adı</div>
                    <div class="info-value" id="hostname">Yükleniyor...</div>
                </div>
                <div class="info-item">
                    <div class="info-label"><i class="bi bi-plug"></i> Port</div>
                    <div class="info-value">5000</div>
                </div>
            </div>
        </header>

        <div class="main-content">
            <div class="section">
                <h2><i class="bi bi-cloud-arrow-up"></i> Dosya Gönder</h2>
                <div id="status" class="status"></div>
                <div id="progressContainer" class="progress-container hidden">
                    <div class="progress-bar">
                        <div class="progress-fill" id="progressFill"></div>
                    </div>
                    <div class="progress-text" id="progressText">0%</div>
                </div>
                <div class="upload-area" id="uploadArea">
                    <div class="upload-icon"><i class="bi bi-arrow-up-circle"></i></div>
                    <div class="upload-text">Dosya seçmek için tıklayın veya sürükleyip bırakın</div>
                    <input type="file" id="fileInput" multiple>
                </div>
            </div>

            <div class="section">
                <h2><i class="bi bi-cloud-arrow-down"></i> Dosyalar</h2>
                <div id="bulkActions" class="bulk-actions hidden">
                    <div class="bulk-info">
                        <i class="bi bi-check-circle"></i> <span id="selectedCount">0</span> dosya seçildi
                    </div>
                    <button class="btn-primary" onclick="selectAllFiles()"><i class="bi bi-check-all"></i> Tümünü Seç</button>
                    <button class="btn-primary" onclick="clearSelection()"><i class="bi bi-x-circle"></i> Seçimi Temizle</button>
                    <button class="btn-primary" onclick="downloadMultiple()"><i class="bi bi-download"></i> Toplu İndir</button>
                    <button class="btn-danger" onclick="deleteMultiple()"><i class="bi bi-trash"></i> Toplu Sil</button>
                </div>
                <div id="fileList" class="file-list">
                    <div class="empty-state">
                        <div class="empty-icon"><i class="bi bi-inbox"></i></div>
                        <div>Henüz dosya yok</div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <!-- Önizleme Modal -->
    <div id="previewModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3></h3>
                <button class="modal-close" id="modalClose"><i class="bi bi-x-lg"></i></button>
            </div>
            <div class="modal-body" id="modalBody"></div>
        </div>
    </div>

    <script src="/templates/script.js"></script>
</body>
</html>
